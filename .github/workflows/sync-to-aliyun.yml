name: Force Sync to Aliyun
on:
  push:
    branches: ["test2me"]

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/test2me' && !contains(github.event.head_commit.message, '自动更新 README.md 中的插件列表表格') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          echo "Current HEAD: $(git rev-parse HEAD)"

      - name: Add aliyun remote
        run: |
          git remote remove aliyun 2>/dev/null || true
          git remote add aliyun https://${{secrets.ALIYUN_ACCOUNT}}:${{secrets.ALIYUN_PASSWORD}}@codeup.aliyun.com/69624f9a58acb3fac7aed520/ATTomatoo/zhenxun_bot_plugins_index.git
          echo "Target remote: https://${{secrets.ALIYUN_ACCOUNT}}@codeup.aliyun.com/69624f9a58acb3fac7aed520/ATTomatoo/zhenxun_bot_plugins_index.git"
          git fetch aliyun test2me --force
          echo "Remote HEAD on Codeup: $(git ls-remote --heads aliyun test2me | awk '{print $1}')"

      - name: Skip if already synced
        run: |
          CURRENT=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote --heads aliyun test2me | awk '{print $1}')
          if [ -n "$REMOTE" ] && [ "$REMOTE" = "$CURRENT" ]; then
            echo "✅ 当前 commit 已在阿里云目标分支上，跳过重复 push"
            exit 0
          fi

      - name: Force push
        run: |
          echo "Pushing HEAD $(git rev-parse HEAD) to aliyun test2me"
          git push --progress --force aliyun HEAD:test2me
