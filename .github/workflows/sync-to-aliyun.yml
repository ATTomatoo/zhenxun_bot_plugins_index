name: Force Sync to Aliyun
on:
  push:
    branches: ["test2me"]
jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' && github.event.head_commit.author.name != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '自动补全 ali_url') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000  
          git config --global core.compression 0

      - name: Add aliyun remote
        run: |
          git remote add aliyun https://${{secrets.ALIYUN_ACCOUNT}}:${{secrets.ALIYUN_PASSWORD}}@codeup.aliyun.com/69624f9a58acb3fac7aed520/ATTomatoo/zhenxun_bot_plugins_index.git
          git fetch aliyun test2me --force  # 强制更新本地引用

      - name: Force push
        run: git push --progress --force aliyun HEAD:test2me
